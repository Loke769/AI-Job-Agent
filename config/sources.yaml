# Career page watchlist — curated starter set (scale to thousands)
# Each entry is a real Greenhouse / Lever / Ashby board with a public JSON API.
#
# ATS types:
#   greenhouse -> https://boards-api.greenhouse.io/v1/boards/{token}/jobs
#   lever      -> https://api.lever.co/v0/postings/{token}?mode=json
#   ashby      -> https://api.ashbyhq.com/posting-api/job-board/{token}
#
# Add companies for any role/industry — the collector will loop through all.
# Tip: Find Greenhouse token = part after boards.greenhouse.io/<token>
# Tip: Find Lever token     = lever.co/company/<token>

greenhouse:
